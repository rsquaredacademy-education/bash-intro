name: Build & Deploy to Netlify

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Typst ships no fonts and the bare runner has none either, so a stale
      # fontconfig cache fails the PDF with "font fallback list must not be
      # empty". fc-cache -f makes the resolver see what we just installed.
      - name: Install fonts and zip tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-linuxlibertine fonts-libertinus fonts-dejavu-core zip unzip bsdmainutils
          fc-cache -f

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"

      - name: Setup renv
        uses: r-lib/actions/setup-renv@v2

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.6.40"

      # Pin Typst as well as Quarto, and bump them together — never one alone.
      # Quarto 1.7+ ships a Typst template that Typst 0.11 cannot compile.
      - name: Setup Typst
        uses: typst-community/setup-typst@v4
        with:
          version: "0.11.0"

      - name: Render HTML
        run: |
          Rscript scripts/reset-fixture.R
          quarto render --to html --output-dir /tmp/stage-html

      - name: Render PDF
        run: |
          Rscript scripts/reset-fixture.R
          quarto render --to pdf --output-dir /tmp/stage-pdf

      - name: Render ePub
        run: |
          Rscript scripts/reset-fixture.R
          quarto render --to epub --output-dir /tmp/stage-epub

      # downloads: [pdf, epub] is advertised on the landing page; assert the
      # artifacts really shipped rather than trusting the assemble step.
      - name: Verify downloads are present
        run: |
          ls /tmp/stage-pdf/*.pdf || { echo "PDF MISSING"; exit 1; }
          ls /tmp/stage-epub/*.epub || { echo "EPUB MISSING"; exit 1; }

      - name: Assemble docs
        run: |
          rm -rf docs && mkdir -p docs
          cp -r /tmp/stage-html/. docs/
          cp /tmp/stage-pdf/*.pdf docs/
          cp /tmp/stage-epub/*.epub docs/
          cp netlify.toml 404.html robots.txt docs/
          bash scripts/make-sitemap.sh docs https://bash-intro.rsquaredacademy.com

      - name: Verify redirects
        run: bash scripts/test-redirects.sh docs

      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: "docs/**/*.html --root-dir docs --exclude 'mailto:*'"

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: ./docs
          production-branch: master
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: ${{ github.event.head_commit.message }}
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
